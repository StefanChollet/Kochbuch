# ==========================================================================
# VORLAGE: nginx-Site fuer chollet.corvent.ch auf trex
# (/etc/nginx/sites-available/chollet.corvent.ch, Link in sites-enabled)
#
# Wichtig: die bestehende Datei NICHT blind ersetzen - nur den Inhalt des
# 443-Blocks wie unten anpassen. Die ssl_*-Zeilen von certbot behalten.
# ==========================================================================

server {
    listen 80;
    listen [::]:80;
    server_name chollet.corvent.ch;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chollet.corvent.ch;

    # --- von certbot verwaltet (bestehende Zeilen uebernehmen) ---
    ssl_certificate     /etc/letsencrypt/live/chollet.corvent.ch/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chollet.corvent.ch/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Verteiler + alle Apps (erzeugt aus apps.json) ---
    # Ersetzt das fruehere:  location / { proxy_pass http://127.0.0.1:3000; ... }
    include snippets/chollet-apps.conf;
}
