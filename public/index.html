<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Die Apps erkennen am Referer, dass man von dieser Startseite kommt. -->
<meta name="referrer" content="same-origin">
<title>Chollet Apps</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="verteiler.css">
</head>
<body>

<header class="head">
  <h1 id="titel">Chollet Apps</h1>
  <p class="sub">Bitte eine Anwendung wählen.</p>
</header>

<main>
  <ul id="apps" class="apps" aria-label="Anwendungen"></ul>
  <noscript>
    <ul class="apps">
      <li><a class="app" href="/kochbuch/"><span class="app-text"><span class="app-name">Kochbuch</span></span></a></li>
      <li><a class="app" href="/travelfy/"><span class="app-text"><span class="app-name">Travelfy</span></span></a></li>
    </ul>
  </noscript>
</main>

<footer class="foot">Jede Anwendung hat ihre eigene Anmeldung. Ein direkter Wechsel zwischen den Anwendungen ist gesperrt – bitte immer über diese Startseite.</footer>

<script src="verteiler.js"></script>
</body>
</html>
